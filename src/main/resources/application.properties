spring.application.name=event

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/eventdb

# Server
server.port=8080

# JWT
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Mail (configure for real use)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply@eventhub.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.com.company.event=DEBUG
logging.level.org.springframework.security=WARN

# JDoodle (for code execution)
jdoodle.client-id=${JDOODLE_CLIENT_ID:}
jdoodle.client-secret=${JDOODLE_CLIENT_SECRET:}
jdoodle.api-url=https://api.jdoodle.com/v1/execute


# Springdoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
