spring:
  application:
    name: event
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/mydb}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${supabase.url}/auth/v1
          jwk-set-uri: ${supabase.url}/auth/v1/.well-known/jwks.json

server:
  port: ${SERVER_PORT:8080}

# Supabase Configuration
supabase:
  url: ${SUPABASE_URL:https://jjarmqjnicpupconlggr.supabase.co}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}

# Default Admin (created on first startup)
app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    email: ${ADMIN_EMAIL:admin@eventhub.com}

# JDoodle Code Execution API
jdoodle:
  client-id: ${JDOODLE_CLIENT_ID:dummy_id}
  client-secret: ${JDOODLE_CLIENT_SECRET:dummy_secret}
  api-url: ${JDOODLE_API_URL:https://api.jdoodle.com/v1/execute}

# Actuator health endpoint
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Logging
logging:
  level:
    com.company.event: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
