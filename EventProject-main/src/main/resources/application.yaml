spring:
  application:
    name: event
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/mydb}

server:
  port: ${SERVER_PORT:8080}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gZ2VuZXJhdGlvbiB1c2luZyBobWFjIHNoYTI1Ng==}
  expiration: ${JWT_EXPIRATION:86400000}   # 24 hours in ms

# Default Admin (created on first startup)
app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    email: ${ADMIN_EMAIL:admin@eventhub.com}

# JDoodle Code Execution API
jdoodle:
  client-id: ${JDOODLE_CLIENT_ID:dummy_id}
  client-secret: ${JDOODLE_CLIENT_SECRET:dummy_secret}
  api-url: ${JDOODLE_API_URL:https://api.jdoodle.com/v1/execute}

# Actuator health endpoint
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Logging
logging:
  level:
    com.company.event: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
